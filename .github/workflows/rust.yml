name: Rust
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Verify original Cerune source fixtures
        run: python scripts/verify_snapshot.py
      - name: Check documentation links and translations
        run: |
          node scripts/check-docs.cjs
          node --test scripts/check-docs.test.cjs
      - name: Check formatting
        run: cargo fmt --check
      - name: Run Rust tests
        env:
          SASHIMI_TEST_CLANG: clang
        run: cargo test --all-targets
      - name: Check API documentation examples
        run: cargo test --doc
      - name: Check warnings
        run: cargo clippy --all-targets -- -D warnings
      - name: Run typed instruction example
        run: cargo run --example typed
      - name: Generate Program artifacts for both targets
        run: |
          cargo run --example program -- x86_64-unknown-linux-gnu target/program-linux
          cargo run --example program -- x86_64-pc-windows-msvc target/program-windows
